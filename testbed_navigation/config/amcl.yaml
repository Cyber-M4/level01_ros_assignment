amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"

    laser_model_type: "likelihood_field"
    laser_min_range: -1.0
    laser_max_range: 1.5
    laser_likelihood_max_dist: 2.0

    max_beams: 60
    min_particles: 500
    max_particles: 2000

    update_min_a: 0.1
    update_min_d: 0.1

    resample_interval: 1
    transform_tolerance: 1.0

    set_initial_pose: true
    always_reset_initial_pose: false

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
